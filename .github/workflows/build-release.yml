name: Build Windows EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build self-contained win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Tesseract eng.traineddata
        shell: pwsh
        run: |
          $dir = "src/ScreenshotTextEditor/Resources/tessdata"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata"
          Invoke-WebRequest -Uri $url -OutFile "$dir/eng.traineddata"
          Write-Host "tessdata size:" (Get-Item "$dir/eng.traineddata").Length

      - name: Restore
        run: dotnet restore ScreenshotTextEditor.sln

      - name: Build
        run: dotnet build ScreenshotTextEditor.sln -c Release --no-restore

      - name: Publish self-contained single-file
        run: |
          dotnet publish src/ScreenshotTextEditor/ScreenshotTextEditor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = "publish/ScreenshotTextEditor.exe"
          if (!(Test-Path $exe)) { throw "Release EXE was not produced: $exe" }
          Write-Host "EXE verified:" (Get-Item $exe).FullName
          Write-Host "EXE size:" (Get-Item $exe).Length

      - name: List publish output
        shell: pwsh
        run: Get-ChildItem -Recurse publish | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotTextEditor-win-x64
          path: publish/**
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ScreenshotTextEditor-win-x64
          path: artifacts

      - name: Zip release
        run: |
          cd artifacts
          zip -r ../ScreenshotTextEditor-win-x64.zip .
          ls -lh ../ScreenshotTextEditor-win-x64.zip

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "version=v${{ github.event.inputs.version || '1.0.1' }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v1.0.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Screenshot Text Editor ${{ steps.ver.outputs.version }}
          body: |
            ## Screenshot Text Editor – Offline Windows EXE

            Fully offline native Windows application.

            ### Download
            - **ScreenshotTextEditor-win-x64.zip** – self-contained Windows x64 EXE

            ### Features
            - Local Tesseract OCR
            - OpenCV inpainting (text removal)
            - Font matching against installed Windows fonts
            - SkiaSharp text rendering
            - Drag & drop / paste
            - Export + native Windows printing
            - Works with Wi-Fi off / Airplane mode

            ### Installation
            Extract the zip and run `ScreenshotTextEditor.exe`.
            The application is self-contained and does not require .NET to be installed separately.
          files: ScreenshotTextEditor-win-x64.zip
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
